# Exact reproduction of successful checkpoint 20260108_222640
# Using d6_3b_v1 (same data as d6_3b_v0, just repacked)
init_dir = "inits/v2/50m_ablations/n1_binned_attn_sink_qk"
checkpoint_dir = "checkpoints"
seed = 42
compile_enabled = true

[wandb]
enabled = true
project = "train-2048-bin-v2"
entity = ""
tags = ["v2", "macroxue-binned", "attn-sink", "ablation", "repro-good"]
mode = "online"
report_every = 50

[target]
mode = "macroxue_tokens"

[hyperparameters]
learning_rate = 5e-4
grad_clip_norm = 1.0

[hyperparameters.lr_schedule]
name = "warmup-stable-decay"
warmup_steps = 2000
decay_steps = 0
cooldown_pct = 0.1
min_lr_ratio = 0.1

[hyperparameters.optimizer]
name = "adamw"
weight_decay = 0.01
beta1 = 0.9
beta2 = 0.98
eps = 1e-8

[batch]
batch_size = 1024

[batch.adaptive]
enabled = false
double_at_lr_ratio = 0.5
quadruple_at_lr_ratio = 0.25

[dropout]
dropout_prob = 0.03
attention_dropout_prob = 0.0

[binning]
strategy = "edges"
special_zero_one = true
edges = [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99, 0.995, 0.998, 0.999, 1.0]

[dataset]
dataset_dir = "datasets/raws/d7_4000g_v1"
tokenizer_path = "out/macroxue_v2/tokenizer.json"
val_run_pct = 0.005
val_split_seed = 42
mmap_mode = true
shuffle = false
shuffle_buffer_size = 1000000
shard_locality = true
shard_cache_in_memory = true
shard_cache_keep_shards = 1
val_num_steps = 200
val_steps_pct = 0.0
num_steps = 100_000
val_every = 5000

[dataset.rotation_augment]
mode = "random_k"
allow_noop = true

[dataset.flip_augment]
mode = "random_axis"
allow_noop = true

[checkpoint]
every_epochs = 1
save_best_every_steps = 10000
best_min_delta = 0.002

[amp]
master_weights_fp32 = true
